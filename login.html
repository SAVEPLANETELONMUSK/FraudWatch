<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FraudWatch Admin Login</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
<div class="container">
<h1>🛡 FraudWatch</h1>
<p>Administrator Login</p>
</div>
</header>

<section class="container">

<div class="card">

<h2>Admin Login</h2>

<form id="loginForm">

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button class="btn" type="submit">
🔐 Login
</button>

</form>

<div id="loginResult"></div>

</div>

</section>

<script src="js/login.js"></script>

</body>
</html>
